<meta name="theme-color" content="#2563eb">
<title>ExamSathi AI</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033;
 padding-bottom:72px
}
body.dark{background:#0f172a;color:#f8fafc}
header{
 position:sticky;top:0;z-index:100;
 background:linear-gradient(135deg,#2563eb,#4f46e5);
 color:white;padding:15px
}
.head{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:23px;font-weight:800}
.tag{font-size:11px;margin-top:4px;opacity:.9}
button{cursor:pointer}
.lang{
 background:#ffffff22;border:1px solid #ffffff55;color:white;
 padding:8px 12px;border-radius:9px
}
main{max-width:1100px;margin:auto;padding:15px}
.hero{
 background:linear-gradient(135deg,#1d4ed8,#7c3aed);
 color:white;border-radius:20px;padding:25px;margin-bottom:18px
}
.hero h1{margin:0 0 8px;font-size:27px}
.search{
 width:100%;padding:14px;border-radius:12px;
 border:1px solid #d7deea;margin:12px 0;
 font-size:15px
}
.grid{
 display:grid;grid-template-columns:repeat(2,1fr);gap:12px
}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.card,.box{
 background:white;border:1px solid #e2e8f0;border-radius:16px;
 padding:17px;margin-bottom:12px
}
.dark .card,.dark .box,.dark .question,.dark .search{
 background:#172033;color:#f8fafc;border-color:#334155
}
.card{cursor:pointer;transition:.2s}
.card:hover{transform:translateY(-2px)}
.icon{font-size:27px;margin-bottom:8px}
.card h3,.box h3{margin:4px 0 7px}
.card p,.muted{font-size:13px;color:#64748b}
.dark .card p,.dark .muted{color:#94a3b8}
.title{margin:22px 0 12px}
.btn{
 background:#2563eb;color:white;border:0;border-radius:10px;
 padding:11px 15px;font-weight:bold;margin:3px
}
.btn.gray{background:#e2e8f0;color:#172033}
.btn.green{background:#16a34a}
.back{
 border:0;background:none;color:#2563eb;font-weight:bold;
 font-size:15px;margin-bottom:12px
}
.badge{
 display:inline-block;background:#dbeafe;color:#1d4ed8;
 border-radius:7px;padding:5px 8px;font-size:11px;font-weight:bold
}
.dark .badge{background:#1e3a8a;color:#bfdbfe}
.list{
 display:flex;justify-content:space-between;align-items:center;
 gap:10px
}
.note{line-height:1.75;font-size:14px}
.question{
 background:white;border:1px solid #e2e8f0;border-radius:16px;
 padding:17px;margin-bottom:12px
}
.option{
 display:block;width:100%;text-align:left;padding:12px;
 border:1px solid #dbe2ec;border-radius:10px;
 background:#f8fafc;margin-top:8px
}
.dark .option{background:#202c40;color:white;border-color:#3b4a61}
.correct{background:#dcfce7!important;border-color:#16a34a!important}
.wrong{background:#fee2e2!important;border-color:#dc2626!important}
.stat{
 display:grid;grid-template-columns:repeat(2,1fr);gap:10px
}
.statbox{
 background:#eff6ff;border-radius:14px;padding:15px
}
.dark .statbox{background:#172554}
.statbox strong{display:block;font-size:24px}
.bottom{
 position:fixed;bottom:0;left:0;right:0;z-index:100;
 display:flex;justify-content:space-around;
 background:white;border-top:1px solid #ddd;padding:8px 2px
}
.dark .bottom{background:#111827;border-color:#334155}
.bottom button{
 border:0;background:none;color:#64748b;font-size:11px
}
.dark .bottom button{color:#cbd5e1}
.bottom b{display:block;font-size:19px}
.hidden{display:none}
</style>
</head>

 bookmarks:JSON.parse(localStorage.getItem("bookmarks")||"[]")
};

if(dark)document.body.classList.add("dark");

function save(){
 localStorage.setItem("attempted",state.attempted);
 localStorage.setItem("correct",state.correct);
 localStorage.setItem("wrong",JSON.stringify(state.wrong));
 localStorage.setItem("bookmarks",JSON.stringify(state.bookmarks));
 localStorage.setItem("language",lang);
}

function text(hi,en){
 return lang==="hi"?hi:en;

function examsPage(){

document.getElementById("app").innerHTML=`
${header(text("सभी Government Exams","All Government Exams"))}

<input class="search"
 placeholder="${text("Exam खोजें...","Search exam...")}"

<div id="examList"></div>
`;

renderExams(DB.exams);

function subjectQuiz(id){
 const qs=DB.questions.filter(q=>q.subject===id);
 quizPage(qs.length?qs:DB.questions);
}

let quizData=[];
let quizIndex=0;
let quizScore=0;

function quizPage(data){

quizData=Array.isArray(data)?data:[];
quizIndex=0;
quizScore=0;

if(!quizData.length){
 document.getElementById("app").innerHTML=`
 ${header("MCQ")}
 <div class="box">
  <h3>Questions not available yet</h3>
  <p class="note">
   More verified questions can be added to the database without changing the app structure.
  </p>
 </div>`;
 return;
}

renderQuiz();
}

function renderQuiz(){

if(quizIndex>=quizData.length){
 resultPage(
  quizScore,
  quizData.length,
  "Practice Test"
 );
 return;
}

const q=quizData[quizIndex];

document.getElementById("app").innerHTML=`

${header("MCQ Practice")}

<div class="box">
 <span class="badge">
 Question ${quizIndex+1} / ${quizData.length}
 </span>

 <h3 style="margin-top:12px">
 ${text(q.hi,q.en)}
 </h3>

 ${q.options.map((o,i)=>`

 <button class="option"
 onclick="answerQuiz(${i},${q.answer})">
 ${String.fromCharCode(65+i)}. ${o}
 </button>

 `).join("")}

 <p id="explanation" class="note hidden"></p>

</div>
`;
}

function answerQuiz(selected,answer){

document.querySelectorAll(".option").forEach(x=>x.disabled=true);

const buttons=document.querySelectorAll(".option");

if(selected===answer){
 buttons[selected].classList.add("correct");
 quizScore++;
 state.correct++;
}else{
 buttons[selected].classList.add("wrong");
 buttons[answer].classList.add("correct");
 state.wrong.push(quizData[quizIndex].id);
}

state.attempted++;
save();

document.getElementById("explanation").innerHTML=
"💡 "+quizData[quizIndex].explanation;

document.getElementById("explanation").classList.remove("hidden");

setTimeout(()=>{
 quizIndex++;
 renderQuiz();
},700);
}
