<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#2563eb">
<title>ExamSathi AI - Government Exam Preparation</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f7fb;color:#172033;
  padding-bottom:75px;
}
body.dark{background:#101827;color:#f1f5f9}
header{
  background:linear-gradient(135deg,#2563eb,#4f46e5);
  color:white;padding:18px 16px;
  position:sticky;top:0;z-index:50;
  box-shadow:0 3px 12px #0002;
}
.top{display:flex;align-items:center;justify-content:space-between}
.logo{font-size:23px;font-weight:800}
.tag{font-size:12px;opacity:.9;margin-top:4px}
.lang{
  background:#ffffff22;color:white;border:1px solid #ffffff66;
  padding:8px 10px;border-radius:10px;font-weight:bold;
}
.container{max-width:1000px;margin:auto;padding:15px}
.search{
  width:100%;padding:14px;border:1px solid #dbe2ee;
  border-radius:14px;background:white;font-size:15px;
  margin-bottom:15px;
}
.dark .search,.dark .card,.dark .box,.dark .question{
  background:#182235;color:#f1f5f9;border-color:#334155;
}
.hero{
  background:linear-gradient(135deg,#1d4ed8,#7c3aed);
  color:white;border-radius:20px;padding:22px;margin-bottom:18px;
}
.hero h1{font-size:25px;margin-bottom:8px}
.hero p{opacity:.9;line-height:1.5}
.grid{
  display:grid;grid-template-columns:repeat(2,1fr);gap:12px;
}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{
  background:white;border:1px solid #e5eaf2;border-radius:17px;
  padding:17px;cursor:pointer;transition:.2s;
}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 20px #0001}
.icon{font-size:27px;margin-bottom:8px}
.card h3{font-size:15px;margin-bottom:5px}
.card p{font-size:12px;color:#64748b}
.dark .card p{color:#94a3b8}
.section-title{font-size:19px;margin:22px 0 12px}
.box,.question{
  background:white;border:1px solid #e5eaf2;border-radius:16px;
  padding:17px;margin-bottom:12px;
}
.btn{
  border:0;border-radius:11px;padding:11px 15px;
  background:#2563eb;color:white;font-weight:bold;cursor:pointer;
}
.btn.secondary{background:#e2e8f0;color:#172033}
.btn.success{background:#16a34a}
.btn.danger{background:#dc2626}
.btn.small{padding:8px 11px;font-size:12px}
.back{
  background:none;border:0;color:#2563eb;font-weight:bold;
  margin-bottom:15px;cursor:pointer;font-size:15px;
}
.exam{
  display:flex;justify-content:space-between;gap:10px;
  align-items:center;
}
.badge{
  background:#dbeafe;color:#1d4ed8;padding:5px 8px;
  border-radius:8px;font-size:11px;font-weight:bold;
}
.dark .badge{background:#1e3a8a;color:#bfdbfe}
.options button{
  width:100%;text-align:left;margin-top:9px;
  background:#f8fafc;color:#172033;border:1px solid #dbe2ee;
  padding:12px;border-radius:10px;cursor:pointer;
}
.dark .options button{background:#202c40;color:white;border-color:#3b4a61}
.options button.correct{background:#dcfce7!important;border-color:#16a34a}
.options button.wrong{background:#fee2e2!important;border-color:#dc2626}
.bottom{
  position:fixed;bottom:0;left:0;right:0;background:white;
  border-top:1px solid #ddd;display:flex;justify-content:space-around;
  padding:9px 4px;z-index:60;
}
.dark .bottom{background:#111827;border-color:#334155}
.bottom button{
  border:0;background:none;font-size:11px;color:#64748b;cursor:pointer;
}
.bottom b{display:block;font-size:20px;margin-bottom:2px}
.dark .bottom button{color:#cbd5e1}
.stat{
  display:grid;grid-template-columns:repeat(2,1fr);gap:10px;
}
.stat div{
  background:#eff6ff;border-radius:14px;padding:15px;
}
.dark .stat div{background:#172554}
.stat strong{font-size:22px;display:block}
.hide{display:none!important}
.timer{
  position:sticky;top:75px;background:#fee2e2;color:#b91c1c;
  padding:10px;text-align:center;border-radius:10px;font-weight:bold;
  z-index:20;margin-bottom:10px;
}
.note{
  line-height:1.7;font-size:14px;
}
footer{text-align:center;color:#64748b;padding:25px 10px;font-size:12px}
</style>
</head>

<body>

<header>
  <div class="top">
    <div>
      <div class="logo">🎓 ExamSathi AI</div>
      <div class="tag">Government Exam Preparation • Learn • Practice • Succeed</div>
    </div>
    <button class="lang" onclick="toggleLanguage()" id="langBtn">हिंदी</button>
  </div>
</header>

<main class="container">

<div id="app"></div>

</main>

<nav class="bottom">
  <button onclick="home()"><b>🏠</b>Home</button>
  <button onclick="showExams()"><b>🇮🇳</b>Exams</button>
  <button onclick="showPractice()"><b>📝</b>Practice</button>
  <button onclick="showNotes()"><b>📚</b>Notes</button>
  <button onclick="showMore()"><b>☰</b>More</button>
</nav>

["History","Modern India","आधुनिक भारतीय इतिहास में 1857 का विद्रोह, भारतीय राष्ट्रीय कांग्रेस, स्वतंत्रता आंदोलन और प्रमुख घटनाएँ महत्वपूर्ण हैं।"],

["Computer","Computer Basics","कंप्यूटर एक electronic device है जो data को process करके information देता है। CPU को कंप्यूटर का brain कहा जाता है।"],
["Biology","Human Body","मानव शरीर में विभिन्न अंग-तंत्र जैसे पाचन, श्वसन, परिसंचरण और तंत्रिका तंत्र महत्वपूर्ण हैं।"],

exp:"1857 के विद्रोह को First War of Independence भी कहा जाता है।"

/* =========================================================
   CURRENT AFFAIRS
========================================================= */

const currentAffairs=[
["Current Affairs","राष्ट्रीय घटनाएँ","महत्वपूर्ण सरकारी योजनाओं, राष्ट्रीय घटनाओं और नीतिगत निर्णयों को नियमित रूप से revise करें।"],
["Current Affairs","अंतरराष्ट्रीय घटनाएँ","अंतरराष्ट्रीय संगठन, प्रमुख सम्मेलन, देशों के संबंध और महत्वपूर्ण वैश्विक घटनाएँ परीक्षा के लिए महत्वपूर्ण हैं।"],
["Current Affairs","Sports","प्रमुख टूर्नामेंट, विजेता, पुरस्कार और खिलाड़ियों से संबंधित घटनाओं को नोट करें।"],
["Current Affairs","Awards","राष्ट्रीय एवं अंतरराष्ट्रीय पुरस्कार और सम्मान current affairs में महत्वपूर्ण होते हैं।"],
["Current Affairs","Science & Technology","नई वैज्ञानिक उपलब्धियाँ, space missions, technology और defence technology पर विशेष ध्यान दें।"]

/* =========================================================
   APP STATE
========================================================= */

let language="en";
let score=0;
let attempted=0;
let bookmarked=[];
let wrong=[];
let progress=JSON.parse(localStorage.getItem("examProgress")||"{}");

/* =========================================================
   COMMON
========================================================= */

function save(){
 localStorage.setItem("examProgress",JSON.stringify(progress));
}

function title(){
 return language==="en"?"India's Government Exam Preparation":"भारत की सरकारी परीक्षा तैयारी";
}

function home(){
 document.getElementById("app").innerHTML=`

 <section class="hero">
   <h1>🎓 ${language==="en"?"ExamSathi AI":"एग्जामसाथी AI"}</h1>
   <p>${language==="en"

 </div>

 <h2 class="section-title">${language==="en"?"Explore":"एक्सप्लोर करें"}</h2>

   <div class="card" onclick="startMock()"><div class="icon">🎯</div><h3>Mock Test</h3><p>Full practice test</p></div>
   <div class="card" onclick="showPYQ()"><div class="icon">📄</div><h3>PYQ</h3><p>Previous year practice</p></div>
   <div class="card" onclick="showSubjects()"><div class="icon">📖</div><h3>Chapter Tests</h3><p>Chapter-wise tests</p></div>
   <div class="card" onclick="showRevision()"><div class="icon">⚡</div><h3>Revision</h3><p>Quick revision</p></div>
 </div>

 <h2 class="section-title">🔥 Daily Practice</h2>
 <div class="box">
   <h3>Daily 10 MCQ Challenge</h3>
   <p style="margin:8px 0 13px;color:#64748b">Practice questions every day and improve your score.</p>
   <button class="btn" onclick="startMock()">Start Challenge</button>
 </div>

 <footer>ExamSathi AI • Learn • Practice • Succeed</footer>
 `;
}

function toggleLanguage(){
 language=language==="en"?"hi":"en";
 document.getElementById("langBtn").innerText=language==="en"?"हिंदी":"English";
 home();
}

/* =========================================================
   EXAMS
========================================================= */

function showExams(){
 document.getElementById("app").innerHTML=`
 <button class="back" onclick="home()">← Home</button>
 <h2 class="section-title">🇮🇳 Government Exams</h2>
 <input class="search" placeholder="Search exam..." oninput="filterExams(this.value)">
 <div id="examList"></div>
 `;
 renderExams(exams);
}

function renderExams(list){
 document.getElementById("examList").innerHTML=list.map((e,i)=>`
 <div class="box exam">
   <div>
    <h3>${e[0]}</h3>
    <p style="margin-top:5px;color:#64748b">${e[1]} • ${e[2]}</p>
   </div>
   <button class="btn small" onclick="examDetails('${e[0]}')">Open</button>
 </div>
 `).join("");
}

function filterExams(v){
 renderExams(exams.filter(x=>x[0].toLowerCase().includes(v.toLowerCase())));
}

function examDetails(name){
 document.getElementById("app").innerHTML=`
 <button class="back" onclick="showExams()">← Exams</button>
 <div class="hero">
   <h1>🎯 ${name}</h1>
   <p>Complete preparation dashboard</p>
 </div>
 <div class="grid">
   <div class="card" onclick="showNotes()"><div class="icon">📚</div><h3>Notes</h3></div>
   <div class="card" onclick="showMCQ()"><div class="icon">📝</div><h3>MCQ</h3></div>
   <div class="card" onclick="startMock()"><div class="icon">🎯</div><h3>Mock Test</h3></div>
   <div class="card" onclick="showPYQ()"><div class="icon">📄</div><h3>PYQ</h3></div>
 </div>
 <div class="box" style="margin-top:15px">
  <h3>📋 Preparation</h3>
  <p class="note">Syllabus → Notes → Chapter Tests → PYQ → Mock Tests → Revision</p>
 </div>
 `;
}

/* =========================================================
   NOTES
========================================================= */

function showNotes(){
 document.getElementById("app").innerHTML=`
 <button class="back" onclick="home()">← Home</button>
 <h2 class="section-title">📚 All Subjects Notes</h2>
 <div class="grid">
 ${subjects.map(s=>`
 <div class="card" onclick="subjectNotes('${s[0]}')">
   <div class="icon">${s[1]}</div>
   <h3>${s[0]}</h3>
   <p>Important exam notes</p>
 </div>`).join("")}
 </div>
 `;
}

function subjectNotes(subject){
 let data=notes.find(x=>x[0].toLowerCase().includes(subject.toLowerCase().split(" ")[0]));
 document.getElementById("app").innerHTML=`
 <button class="back" onclick="showNotes()">← Subjects</button>
 <h2 class="section-title">📖 ${subject}</h2>
 <div class="box">
   <h3>${data?data[1]:"Important Topics"}</h3>
   <p class="note">${data?data[2]:"इस विषय के महत्वपूर्ण topics को chapter-wise पढ़ें और उसके बाद chapter test दें।"}</p>
 </div>
 <button class="btn" onclick="chapterTest('${subject}')">📝 Chapter Test</button>
 `;
}

   CURRENT AFFAIRS

/* =========================================================
   MCQ
========================================================= */

function showPractice(){
 document.getElementById("app").innerHTML=`
 <button class="back" onclick="home()">← Home</button>
 <h2 class="section-title">📝 Practice Zone</h2>
 <div class="grid">
  <div class="card" onclick="showMCQ()"><div class="icon">📝</div><h3>MCQ Practice</h3></div>
  <div class="card" onclick="chapterTest('General Knowledge')"><div class="icon">📖</div><h3>Chapter Test</h3></div>
  <div class="card" onclick="startMock()"><div class="icon">🎯</div><h3>Mock Test</h3></div>
  <div class="card" onclick="showPYQ()"><div class="icon">📄</div><h3>PYQ</h3></div>
 </div>`;
}

function showMCQ(){
 let html=`
 <button class="back" onclick="home()">← Home</button>
 <h2 class="section-title">📝 MCQ Practice</h2>
 <div class="box"><b>Topic:</b> Mixed Government Exam Questions</div>
 <div id="mcqArea"></div>
 `;
 document.getElementById("app").innerHTML=html;
 renderQuestions(mcqs,"mcqArea");
}

function renderQuestions(data,id){
 document.getElementById(id).innerHTML=data.map((x,i)=>`
 <div class="question">
  <span class="badge">${x.sub}</span>
  <h3 style="margin:10px 0">${i+1}. ${language==="en"?x.en:x.q}</h3>
  <div class="options">
   ${x.o.map((o,j)=>`
    <button onclick="answer(this,${i},${j},${x.a})">${String.fromCharCode(65+j)}. ${o}</button>
   `).join("")}
  </div>
  <p id="exp${i}" class="note hide" style="margin-top:10px"></p>
 </div>
 `).join("");
}

function answer(btn,i,selected,correct){
 let parent=btn.parentElement;
 [...parent.children].forEach(b=>b.disabled=true);
 let exp=document.getElementById("exp"+i);
 if(selected===correct){
  btn.classList.add("correct");
  score++;
  exp.innerHTML="✅ Correct! "+mcqs[i].exp;
 }else{
  btn.classList.add("wrong");
  parent.children[correct].classList.add("correct");
  wrong.push(mcqs[i]);
  exp.innerHTML="❌ Incorrect. "+mcqs[i].exp;
 }
 attempted++;
 exp.classList.remove("hide");
 progress["mcq"]=(progress["mcq"]||0)+1;
 save();
}

/* =========================================================
   MOCK TEST
========================================================= */

let mockIndex=0;
let mockScore=0;
let mockQuestions=[];

function startMock(){
 mockQuestions=[...mcqs].sort(()=>Math.random()-.5).slice(0,10);
 mockIndex=0;
 mockScore=0;
 renderMock();
}

function renderMock(){
 if(mockIndex>=mockQuestions.length){
  document.getElementById("app").innerHTML=`
   <div class="hero">
    <h1>🎯 Mock Test Complete</h1>
    <p>Your performance</p>
   </div>
   <div class="stat">
    <div><strong>${mockScore}</strong><small>Correct</small></div>
    <div><strong>${mockQuestions.length}</strong><small>Total</small></div>
   </div>
   <div class="box" style="margin-top:15px">
    <h3>Score: ${Math.round(mockScore/mockQuestions.length*100)}%</h3>
    <p class="note">Keep practicing and improve your performance.</p>
   </div>
   <button class="btn" onclick="startMock()">🔄 Retake Mock</button>
   <button class="btn secondary" onclick="home()">Home</button>
  `;
  return;
 }

 let q=mockQuestions[mockIndex];

 document.getElementById("app").innerHTML=`
 <button class="back" onclick="home()">← Exit Test</button>
 <div class="timer">⏱️ Question ${mockIndex+1} / ${mockQuestions.length}</div>
 <div class="question">
  <span class="badge">${q.sub}</span>
  <h3 style="margin:12px 0">${language==="en"?q.en:q.q}</h3>
  <div class="options">
   ${q.o.map((o,j)=>`
    <button onclick="mockAnswer(${j},${q.a})">${String.fromCharCode(65+j)}. ${o}</button>
   `).join("")}
  </div>
 </div>
 `;
}

function mockAnswer(selected,correct){
 if(selected===correct)mockScore++;
 mockIndex++;
 renderMock();
}

function globalSearch(value){
 if(!value.trim())return;
 let q=value.toLowerCase();
 let result=exams.filter(e=>e[0].toLowerCase().includes(q));
 if(result.length){
  document.getElementById("app").innerHTML=`
   <button class="back" onclick="home()">← Home</button>
   <h2 class="section-title">🔍 Search Results</h2>
   <div id="searchResults"></div>
  `;
  renderExams(result);
 }
}
